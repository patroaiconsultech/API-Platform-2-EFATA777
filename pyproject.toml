[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orkio-platform-backend-rc1"
version = "0.6.3"
description = "ORKIO Plataforma 2.0 controlled RC1 test implementation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  "openai==2.46.0"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
